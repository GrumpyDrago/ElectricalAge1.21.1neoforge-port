name: Build

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check that the tag is the version of the mod
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '\r')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but mod_version in gradle.properties makes it v$version"
            exit 1
          fi
      - name: Build
        run: ./gradlew -Dorg.gradle.java.installations.auto-download=false build
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            echo "For Minecraft 1.21.1. Needs NeoForge 21.1 and [Kotlin for Forge](https://modrinth.com/mod/kotlin-for-forge) 5."
            echo "Worlds made with the 1.7.10 version cannot be opened. Back up your worlds before updating."
            echo
            tr -d '\r' < docs/changelog.md |
              awk -v heading="## $version" '$0 == heading { on = 1; next } /^## / { on = 0 } on' |
              sed "s#](\([a-z-]*\.md\))#]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/\1)#g"
          } > release-notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --title "Electrical Age $version" --notes-file release-notes.md "${prerelease[@]}"
